services:
  postgres:
    image: postgres:16-alpine
    container_name: worktrackr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worktrackr
      POSTGRES_PASSWORD: worktrackr_password
      POSTGRES_DB: worktrackr_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worktrackr -d worktrackr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
